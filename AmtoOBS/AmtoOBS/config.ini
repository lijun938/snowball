; Snowball 配置文件
; 放在 exe 同目录下，双击即可启动
; 命令行参数会覆盖此文件的值

[detector]
; 推理后端: trt (TensorRT-YOLO)
backend=trt
; TensorRT 引擎文件路径（相对于 exe 目录）
engine=apex-yolov8n-trtyolo.engine
; CUDA 设备编号
device=0

[capture]
; 采集模式: qcap (天创710等QCAP采集卡) / opencv (通用采集卡/USB采集卡)
; 没有天创采集卡的用户请改为 opencv
mode=qcap
; OpenCV 设备编号（mode=opencv 时生效，0=第一个设备，1=第二个...）
opencv_index=0
; 采集卡分辨率（按实际输出设置）
width=1920
height=1080
; 采集卡设备名（mode=qcap 时生效，天创710N1 = SC0710 PCI）
device=SC0710 PCI
; 设备序号（多卡时区分）
index=0
; 视频输入: hdmi / dvi / displayport / auto
input=hdmi
; 帧率（0=自动）
fps=0
; 色彩空间
colorspace=bgr24
; GPU直传（推荐开启）
gpudirect=true

[movement]
; 输出后端: titan-two-gamepad
backend=titan-two-gamepad
; GCV 通信文件路径（相对于 exe 目录，指向 Gtuner 工作区）
titan_two_gcv_path=gtuner_cv_workspace\titan_two_gcv.bin
; ---- 瞄准基础参数 ----
; 垂直偏移（负值偏头，推荐 -0.15 ~ -0.25）
vertical_bias=-0.20
; 死区像素（防微抖，推荐 4-8）
deadzone=6.0
; 准心偏移
center_offset_x=0.0
center_offset_y=0.0
; ---- TitanTwo 参数 ----
titan_two_hold_ms=16
; ---- 摇杆输出参数 ----
; 最大输出百分比
stick_max_percent=100.0
; 摇杆曲线（>1柔和 <1灵敏，推荐 0.3-1.3）
stick_curve=1.15
; 响应倍率（推荐 1.5-3.0）
stick_response_boost=2.0
; 最小输出百分比
stick_min_percent=6.5
; ---- 追踪参数 ----
aim_tracking=true
; 确认帧数（检测几帧后锁定目标）
aim_track_confirm_frames=1
; 丢失帧数（丢失几帧后释放目标）
aim_track_lost_frames=10
; 匹配最大代价
aim_track_match_max_cost=2.0
; 目标锁定粘性（越大越不容易切目标，推荐 1.0-2.0）
aim_lock_bonus=1.5
; 目标切换阈值
aim_switch_margin=0.6
; ---- OneEuro 滤波 ----
aim_one_euro=true
aim_one_euro_min_cutoff=1.2
aim_one_euro_beta=0.04
aim_one_euro_d_cutoff=1.0
; ---- 运动预测 ----
; 预测时间（ms，推荐 30-60）
aim_prediction_ms=45.0
aim_prediction_max_box=0.35
; ---- PD 控制 ----
stick_pd=true
stick_d_gain=0.035
stick_feed_forward=0.020
stick_slew=650.0
; ---- FOV 限制 ----
; FOV半径像素（0=不限制）
fov_radius=0.0

[general]
headless=false
